name: Test branch / Build

# Debug APKs of this branch (mTLS work and all fixes) for testing, published as a pre-release for each commit
on:
  push:
    branches:
      - test/custom-ca-mtls-all
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Assemble debug APKs
        run: ./gradlew assembleDebug
      - name: Create publish bundle
        run: mkdir -p build/gh-app-publish/; find app/build/ -iname "*.apk" -exec mv "{}" build/gh-app-publish/ \;
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          retention-days: 14
          if-no-files-found: error
          path: build/gh-app-publish/
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-build-${GITHUB_SHA::8}"
          gh release create "$tag" build/gh-app-publish/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test build ${GITHUB_SHA::8}" \
            --notes "Debug APKs of test/custom-ca-mtls-all at ${GITHUB_SHA::8}: the mTLS work and all fixes. For testing only, signed with a debug key."
